name: Claude Code Review

# pull_request_target runs in the context of the BASE repo (not the fork),
# giving access to secrets even for PRs from forks.
# Security note: the checkout below intentionally uses the base branch ref,
# NOT the fork's code, to avoid executing untrusted code with repo secrets.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          # Explicitly checkout the base branch, not the fork's code.
          # This is required when using pull_request_target with fork PRs.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Anthropic's app-token exchange rejects OIDC tokens minted for
          # pull_request_target runs ("401 Invalid OIDC token"), so use the
          # workflow's own GITHUB_TOKEN instead of the OIDC exchange.
          # Comments are posted as github-actions[bot] instead of claude[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Review PRs from fork contributors too (the reason this workflow
          # uses pull_request_target). The base branch is checked out, not the
          # fork's code, and the prompt is fixed; restrict to a user list if
          # running Claude on any external PR is a concern.
          allowed_non_write_users: '*'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
